
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>AI Language Translator</h1>
    <p>Translate your text into different languages</p>

    <textarea id="inputText" placeholder="Enter your text here..."></textarea>

    <div class="language-box">

        <div>
            <label>From Language</label>
            <select id="sourceLanguage">
                <option value="en">English</option>
                <option value="ta">Tamil</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
                <option value="ml">Malayalam</option>
                <option value="kn">Kannada</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
            </select>
        </div>

        <div>
            <label>To Language</label>
            <select id="targetLanguage">
                <option value="ta">Tamil</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
                <option value="ml">Malayalam</option>
                <option value="kn">Kannada</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
            </select>
        </div>

    </div>

    <button class="swap-btn" onclick="swapLanguages()">
        ⇄ Swap Languages
    </button>

    <button id="translateBtn" onclick="translateText()">
        Translate
    </button>

    <h3>Translated Text</h3>

    <div id="outputText">
        Your translation will appear here...
    </div>

    <button id="copyBtn" onclick="copyText()">
        Copy Translation
    </button>

</div>

<script>

function swapLanguages() {
    const source = document.getElementById("sourceLanguage");
    const target = document.getElementById("targetLanguage");

    const temp = source.value;
    source.value = target.value;
    target.value = temp;
}

async function translateText() {

    const input = document.getElementById("inputText").value;
    const source = document.getElementById("sourceLanguage").value;
    const target = document.getElementById("targetLanguage").value;

    const output = document.getElementById("outputText");
    const button = document.getElementById("translateBtn");

    if (input.trim() === "") {
        output.innerText = "Please enter some text!";
        return;
    }

    if (source === target) {
        output.innerText = input;
        return;
    }

    button.disabled = true;
    button.innerText = "Translating...";
    output.innerText = "Please wait...";

    try {
        const response = await fetch("/translate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: input,
                source: source,
                target: target
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Translation failed");
        }

        output.innerText = data.translation;

    } catch (error) {
        output.innerText = "Error: " + error.message;
    } finally {
        button.disabled = false;
        button.innerText = "Translate";
    }
}

function copyText() {
    const text = document.getElementById("outputText").innerText;

    if (!text || text === "Your translation will appear here...") {
        alert("No translation to copy!");
        return;
    }

    navigator.clipboard.writeText(text)
        .then(() => alert("Translation copied successfully!"))
        .catch(() => alert("Unable to copy text."));
}

</script>

</body>
</html>
